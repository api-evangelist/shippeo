description: >-
  FinOps view of Shippeo spend. Shippeo is enterprise SaaS billed through a
  negotiated subscription rather than public, metered API pricing. Cost is
  driven by the contracted platform scope - modules (predictive visibility,
  multimodal network, carbon reporting, control tower), transport modes,
  tracked shipment volume, and integration footprint - not by a per-call API
  rate. The Transport Orders, Positions, ETA/Status, and Events-out APIs are
  included with the subscription. Because pricing is quote-based, no per-unit
  rates are reconciled here.
notes: >-
  No public per-unit rates exist; obtain the invoice structure from Shippeo
  during contracting. The dominant cost driver is the enterprise subscription
  and its tracked-volume / module scope.
