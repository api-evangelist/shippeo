meters:
- name: subscription
  description: Contracted enterprise subscription to the Shippeo platform (quote-based).
  unit: contract
  aggregation: sum
  dimensions:
  - account
  - modules
- name: tracked_volume
  description: Volume of tracked shipments / transports, a common scoping factor for the subscription.
  unit: transports
  aggregation: sum
  dimensions:
  - account
  - transportMode
principles:
- name: Visibility
  description: Track which modules and transport modes are contracted and how tracked-shipment volume trends against the subscription scope.
- name: Allocation
  description: Map Shippeo cost to the business units / lanes consuming visibility, using account and transport-mode dimensions.
- name: Optimization
  description: Right-size contracted modules and tracked volume to actual usage; consolidate integrations through the developer portal rather than duplicating flows.
- name: Accountability
  description: Assign an owner for the Shippeo relationship and review the subscription scope at renewal against realized tracking volume.
